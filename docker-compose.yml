version: '3.8'

services:
  expo-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snatch-alert-builder
    environment:
      - NODE_ENV=production
      - SKIP_POST_INSTALL_SCRIPT=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    stdin_open: true
    tty: true
    command: bash

volumes:
  node_modules:
